id: static-web
name: Static Web (HTML / CSS / JS / GitHub Pages)
version: "1.0.0"
description: >-
  Security audit profile for static websites hosted on GitHub Pages or static CDNs.
  Focuses on DOM XSS, unsafe script loading, exposed secrets, and HTTP security headers.

detection:
  any_files:
    - "index.html"
    - "*.html"
  optional_indicators:
    - "CNAME"
    - ".nojekyll"

scanners:
  secret_scan: true
  static_checks: true
  semgrep_configs:
    - "p/javascript"
    - "p/xss"
  npm_audit: false
  composer_audit: false
  dast_passive_zap: optional

checks:
  - id: STATIC-XSS-001
    title: Dangerous DOM sinks (innerHTML, outerHTML, document.write, eval)
    severity: Medium
    cwe: CWE-79
  - id: STATIC-SRI-001
    title: External CDN scripts loaded without Subresource Integrity (SRI)
    severity: Low
    cwe: CWE-353
  - id: STATIC-TARGET-001
    title: External links using target="_blank" without rel="noopener noreferrer"
    severity: Low
    cwe: CWE-1022
  - id: STATIC-HEADERS-001
    title: Missing Content-Security-Policy (CSP) meta tag or security header configuration
    severity: Low
    cwe: CWE-693
  - id: STATIC-SECRETS-001
    title: Hardcoded private tokens or credentials in client-side JS/HTML
    severity: Critical
    cwe: CWE-798

notes:
  - GitHub Pages hosts static frontend assets only; any connected backend (Firebase, Supabase, GAS) must be audited with its matching profile.
